name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extract"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-extract" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "resources/ffmpeg"
          Copy-Item $ffmpegExe.FullName -Destination "resources/ffmpeg/ffmpeg.exe"

      - name: Download whisper.cpp
        run: |
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest"
          $asset = $releases.assets | Where-Object { $_.name -match "whisper-bin-x64\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "Asset whisper-bin-x64.zip introuvable" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "whisper.zip"
          Expand-Archive -Path "whisper.zip" -DestinationPath "whisper-extract"
          New-Item -ItemType Directory -Force -Path "resources/whisper"
          Get-ChildItem -Path "whisper-extract" -Recurse -File | Copy-Item -Destination "resources/whisper/" -Force

      - name: Download Whisper models
        run: |
          New-Item -ItemType Directory -Force -Path "resources/models"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin" -OutFile "resources/models/ggml-small-q5_1.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium-q5_0.bin" -OutFile "resources/models/ggml-medium-q5_0.bin"

      - name: Build and package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}